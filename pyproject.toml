[project]
name = "tofrom-time"
version = "0.1.0"
description = "旅費精算用の経路表示 CLI（Yahoo!乗換案内ベース）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shigeya Suzuki", email = "shigeya@wide.ad.jp" }
]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Utilities",
]

dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "typer>=0.15",
    "rich>=13.9",
    "playwright>=1.49",
]

[project.urls]
Repository = "https://github.com/shigeya/tofrom-time"

[project.scripts]
tofrom-time = "tofrom_time.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tofrom_time"]
